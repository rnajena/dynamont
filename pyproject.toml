[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "setuptools-scm>=7.1"]

[project]
name = "dynamont"
description = "Segmentation/resquiggling tool for ONT signals."
dynamic = ["version"]
authors = [
  {name = "Jannes Spangenberg"}
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Intended Audience :: Science/Research"
]
dependencies = [
  "numpy >=1.26.0",
  "pandas >=2.2.0",
  "matplotlib >=3.2.0",
  "seaborn >=0.13.0",
  "pod5 >=0.3.0",
  "pysam >=0.22.0",
  "zstandard >=0.23.0",
  "tqdm >=4.68"
]
license = {text = "GNUv3"}
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "mypy"
]

[project.scripts]
dynamont-resquiggle = "dynamont.segmentation.segment:main"
dynamont-train = "dynamont.segmentation.train:main"

[project.urls]
repository = "https://github.com/rnajena/dynamont"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  # This covers both typing.TYPE_CHECKING and plain TYPE_CHECKING, with any amount of whitespace
  "if\\s+(typing\\.)?TYPE_CHECKING:",
  'if __name__ == "__main__":'
]
omit = [
  "src/dynamont/_version.py",
  "tests/*"
]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.define = { BUILD_PYTHON_BINDING = "ON" }
sdist.include = ["models/**"]

[tool.scikit-build.wheel]
packages = ["src/dynamont"]

[tool.scikit-build.wheel.force-include]
"models/dna/r10.4.1/dna_r10.4.1_e8.2_260bps.model" = "models/dna/r10.4.1/dna_r10.4.1_e8.2_260bps.model"
"models/dna/r10.4.1/dna_r10.4.1_e8.2_400bps.model" = "models/dna/r10.4.1/dna_r10.4.1_e8.2_400bps.model"
"models/rna/rna002/rna002_5mer.model" = "models/rna/rna002/rna002_5mer.model"
"models/rna/rna004/rna004_9mer.model" = "models/rna/rna004/rna004_9mer.model"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux_*"
manylinux-x86_64-image = "manylinux_2_28"
test-extras = ["test"]
test-sources = ["tests"]
test-command = "python -m pytest tests --no-cov"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_file = "src/dynamont/_version.py"

[tool.mypy]
disallow_untyped_defs = true
files = ["src/dynamont/**/*.py"]
python_version = "3.10"
warn_no_return = true

[tool.pytest.ini_options]
addopts = [
  "-vv",
  "--color=yes",
  "--cov-append",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov=src/dynamont",
  "--tb=native",
  "--strict-markers",
  "--durations=20"
]
markers = [
  "serial: execute test serially (to avoid race conditions)",
  "slow: tests can take a long time (deselect with '-m \"not slow\"')"
]
norecursedirs = [".*", "*.egg*", "build", "dist", "conda.recipe", "examples", "env", "envs", "scripts"]
