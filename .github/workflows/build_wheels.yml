name: Build wheels

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

jobs:
  build-wheels:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Show Git version information
        run: |
          echo "HEAD:"
          git rev-parse HEAD

          echo "Tags pointing at HEAD:"
          git tag --points-at HEAD

          echo "Exact tag:"
          git describe --tags --exact-match || true

          echo "Description:"
          git describe --tags --always --dirty

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl